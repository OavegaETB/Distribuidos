name: Go

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Formato
        run: test -z "$(gofmt -l .)"
      - name: Análisis estático
        run: go vet ./...
      - name: Pruebas con detector de carreras
        run: go test -v -race ./...
      - name: Compilar servidor y cliente
        run: go build ./...
